name: Playwright Tests
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows
    secrets:
      E2E_AUTH_DIRECTORY_URL:
        required: true
      E2E_AUTH_CLIENT_ID:
        required: true
      E2E_AUTH_CLIENT_SECRET:
        required: true
      E2E_INQUESTS_API_CLIENT_ID:
        required: true
      E2E_PROVIDER_USERNAME:
        required: true
      E2E_PROVIDER_PASSWORD:
        required: true
      E2E_PROVIDER_MFA_TOTP_SECRET:
        required: true

