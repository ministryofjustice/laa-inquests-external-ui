      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: |
            test-results/**/trace*.zip
            test-results/**/*.webm
          retention-days: 14

      - name: Notify on test failure
        if: failure()
        run: echo "::error::Playwright tests failed! Check the test report for
          details."

  # Single check that passes only when every shard passes. Mark this job as required for PR checks.
  playwright-result:
    name: Playwright Tests
    needs: playwright
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      status: ${{ needs.playwright.result }}
    steps:
      - name: Fail if any shard failed
        if: needs.playwright.result != 'success'
        run: |
          echo "::error::Playwright tests failed. Check the shard logs and trace artifacts."
          exit 1
