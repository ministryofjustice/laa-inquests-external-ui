    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Chromium and its system libraries are preinstalled. Keep the tag and digest in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
      packages: read

    # NOTE: The api-db Postgres service is not needed while the API is mocked via MSW.

